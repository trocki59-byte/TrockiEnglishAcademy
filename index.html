<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a35"><link rel="manifest" href="manifest.webmanifest"><title>TROÇKİ English Academy</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f8ff;background:#0b1226}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#131f3e;border-bottom:1px solid #334368}main{max-width:1000px;margin:auto;padding:20px}.brand{font-size:25px;font-weight:800}.muted{color:#b7c5e6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#172544;border:1px solid #344568;border-radius:18px;padding:20px;margin:12px 0}button,select{background:#5068eb;color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer}button:hover{background:#657bfa}button:disabled{opacity:.5}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#263858}.good{color:#6ee7b7}.bad{color:#fca5a5}.pill{display:inline-block;padding:5px 10px;background:#2c416a;border-radius:20px;margin:4px}h1,h2,h3{line-height:1.25}footer{text-align:center;padding:28px;color:#b7c5e6}</style></head><body><header><div class="brand">🇬🇧 TROÇKİ ENGLISH ACADEMY</div><div class="muted">İngilizce öğren • Pratik yap • Sınava hazırlan</div><nav><button onclick="view('home')">Ana sayfa</button><button onclick="view('lessons')">Dersler</button><button onclick="view('words')">Kelimeler</button><button onclick="view('exams')">🎓 Sınav merkezi</button><button onclick="view('speaking')">Konuşma</button><button id="updateAppButton" onclick="updateAcademyApp()" style="background:#13866b">🔄 Güncelle</button></nav></header><main id="app"></main><footer>TROÇKİ STUDIO • Eğitim amaçlı ilk sürüm</footer><script>
const lessons=[['A1','Greetings','Hello! How are you?','Merhaba! Nasılsın?'],['A1','Introductions','My name is Alex.','Benim adım Alex.'],['A1','Daily life','I drink tea every morning.','Her sabah çay içerim.'],['A2','Past simple','I visited London yesterday.','Dün Londra’yı ziyaret ettim.'],['B1','Present perfect','I have lived here for five years.','Beş yıldır burada yaşıyorum.'],['B2','Conditionals','If I had time, I would travel.','Zamanım olsaydı seyahat ederdim.'],['C1','Advanced expression','Despite the challenges, we persevered.','Zorluklara rağmen azmettik.'],['C2','Nuanced language','His remarks were open to interpretation.','Sözleri yoruma açıktı.']];
const words=[['apple','elma'],['journey','yolculuk'],['knowledge','bilgi'],['environment','çevre'],['achievement','başarı'],['although','-e rağmen'],['research','araştırma'],['opportunity','fırsat']];
const exams={
YDT:[['If she had studied harder, she _____ the exam.',['passes','will pass','would have passed','has passed','is passing'],2,'Third conditional: If + past perfect, would have + V3.'],['The word “significant” is closest in meaning to _____.',['minor','important','temporary','rare','simple'],1,'Significant: önemli, kayda değer.']],
YDS:[['The research was _____ because the sample was too small.',['inconclusive','definitive','unanimous','irrelevant','flawless'],0,'Inconclusive: kesin sonuca ulaştırmayan.'],['_____ the heavy rain, the event continued.',['Although','Despite','Because','Unless','Whereas'],1,'Despite + isim öbeği kullanılır.']],
YÖKDİL:[['The findings _____ a strong correlation between the variables.',['suggest','denies','has','is','was'],0,'Çoğul özne findings ile suggest kullanılır.'],['The experiment was repeated _____ verify the results.',['so','in order to','despite','unless','whereas'],1,'In order to + fiilin yalın hâli amaç bildirir.']],
HAZIRLIK:[['She _____ English every day.',['study','studies','studying','studied always','is study'],1,'He/she/it ile geniş zamanda -s takısı kullanılır.'],['I have never _____ to Canada.',['be','being','been','was','go'],2,'Present perfect: have + past participle.']]
};
const app=document.getElementById('app');const saved=JSON.parse(localStorage.getItem('tea-progress')||'{"completed":[],"scores":[]}');function persist(){localStorage.setItem('tea-progress',JSON.stringify(saved))}function speak(t){if(!('speechSynthesis'in window))return alert('Bu tarayıcı sesli okumayı desteklemiyor.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}function view(v){if(v==='home')app.innerHTML='<h1>İngilizce öğrenmeye başla ✨</h1><p class="muted">Türkçe açıklamalı dersler, dinleme, kelime tekrarı ve üniversite sınav hazırlığı.</p><div class="grid"><div class="card"><h2>'+saved.completed.length+'/8</h2>Örnek ders tamamlandı</div><div class="card"><h2>'+saved.scores.length+'</h2>Deneme sonucu kaydedildi</div><div class="card"><h2>4</h2>Sınav kategorisi</div></div><div class="card"><h2>Öğrenme yolculuğun</h2><p>A1 → A2 → B1 → B2 → C1 → C2</p><p class="muted">Bu ilk sürüm 8 örnek ders içerir. Tam 50 aşamalı müfredat daha sonra eklenecektir.</p><button onclick="view(\'lessons\')">Derslere başla</button></div>';
if(v==='lessons')app.innerHTML='<h1>📚 İngilizce dersleri</h1>'+lessons.map((l,i)=>'<div class="card"><span class="pill">'+l[0]+'</span><h3>'+l[1]+'</h3><p>'+l[2]+'</p><p class="muted">'+l[3]+'</p><button onclick="speak(lessons['+i+'][2])">🔊 Dinle</button> <button onclick="finish('+i+')">'+(saved.completed.includes(i)?'✓ Tamamlandı':'Tamamladım')+'</button></div>').join('');
if(v==='words')app.innerHTML='<h1>🧠 Kelime kartları</h1><p>İngilizce kelimeyi dinle, ardından Türkçesini gör.</p>'+words.map((w,i)=>'<div class="card"><h2>'+w[0]+'</h2><button onclick="speak(words['+i+'][0])">🔊 Dinle</button> <button onclick="document.getElementById(\'w'+i+'\').hidden=false">Anlamı göster</button><p id="w'+i+'" hidden>'+w[1]+'</p></div>').join('');
if(v==='exams')app.innerHTML='<h1>🎓 Üniversite Sınav Merkezi</h1><p class="muted">Özgün örnek sorular. Resmî ÖSYM soruları değildir.</p><div class="grid">'+Object.keys(exams).map(k=>'<div class="card"><h2>'+k+'</h2><p>2 örnek soru • açıklamalı çözüm</p><button onclick="startExam(\''+k+'\')">Denemeyi başlat</button></div>').join('')+'</div>';
if(v==='speaking')app.innerHTML='<h1>🎙️ Konuşma pratiği</h1><div class="card"><p>Örnek cümle: <strong>Hello, how are you today?</strong></p><button onclick="speak(\'Hello, how are you today?\')">🔊 Dinle</button> <button onclick="listen()">🎤 Konuş</button><p id="heard" class="muted">Mikrofon izni ve desteklenen tarayıcı gereklidir.</p></div>';
}function finish(i){if(!saved.completed.includes(i))saved.completed.push(i);persist();view('lessons')}let active,idx,score;function startExam(k){active=k;idx=0;score=0;question()}function question(){const q=exams[active][idx];app.innerHTML='<h1>'+active+' • Soru '+(idx+1)+'/'+exams[active].length+'</h1><div class="card"><h2>'+q[0]+'</h2>'+q[1].map((a,i)=>'<button class="choice" onclick="answer('+i+')">'+String.fromCharCode(65+i)+') '+a+'</button>').join('')+'<div id="feedback"></div></div>'}function answer(i){const q=exams[active][idx];if(i===q[2])score++;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML='<p class="'+(i===q[2]?'good':'bad')+'">'+(i===q[2]?'✓ Doğru!':'Yanlış. Doğru cevap: '+String.fromCharCode(65+q[2]))+'</p><p>'+q[3]+'</p><button onclick="next()">Devam et →</button>'}function next(){idx++;if(idx<exams[active].length)return question();saved.scores.push({exam:active,score:score,total:exams[active].length,date:new Date().toISOString()});persist();app.innerHTML='<div class="card"><h1>Deneme tamamlandı 🎉</h1><h2>'+score+'/'+exams[active].length+' doğru</h2><p class="muted">Sonuç bu cihazda kaydedildi.</p><button onclick="view(\'exams\')">Sınav merkezine dön</button></div>'}function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('heard').textContent='Bu tarayıcı konuşma tanımayı desteklemiyor.';return}let r=new SR();r.lang='en-US';r.onresult=e=>{let t=e.results[0][0].transcript;document.getElementById('heard').textContent='Algılanan: '+t+' (Bu bir telaffuz puanı değildir.)'};r.onerror=e=>document.getElementById('heard').textContent='Mikrofon hatası: '+e.error;r.start()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});view('home');
</script><script src="./curriculum.js"></script><script>
function academyLessons(){let s=document.createElement('section');s.innerHTML='<h1>📚 50 Derslik Eğitim Programı</h1><p class="muted">A1–C2 seviyeleri, Türkçe açıklama ve her ders için 3 kontrol sorusu.</p>'+ACADEMY_LESSONS.map((l,i)=>'<div class="card"><span class="pill">'+l.level+'</span><h3>'+l.id+'. '+l.title+'</h3><p>'+l.en+'</p><p class="muted">'+l.tr+'</p><button onclick="speak(ACADEMY_LESSONS['+i+'].en)">🔊 Dinle</button> <button onclick="academyQuiz('+i+',0,0)">Alıştırma yap</button></div>').join('');app.replaceChildren(s)}
function academyQuiz(i,j,score){const l=ACADEMY_LESSONS[i],q=l.tasks[j];app.innerHTML='<div class="card"><h2>'+l.title+' • '+(j+1)+'/3</h2><p>'+q.q+'</p>'+q.choices.map((c,k)=>'<button class="choice" onclick="academyCheck('+i+','+j+','+score+','+k+')">'+String.fromCharCode(65+k)+') '+c+'</button>').join('')+'</div>'}
function academyCheck(i,j,score,k){let l=ACADEMY_LESSONS[i],q=l.tasks[j],correct=k===q.answer;score+=correct?1:0;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);app.querySelector('.card').insertAdjacentHTML('beforeend','<p class="'+(correct?'good':'bad')+'">'+(correct?'Doğru!':'Yanlış.')+' '+q.why+'</p><button onclick="academyNext('+i+','+j+','+score+')">Devam et</button>')}
function academyNext(i,j,score){if(j<2)return academyQuiz(i,j+1,score);let key='tea-lesson-'+i;localStorage.setItem(key,String(score));app.innerHTML='<div class="card"><h2>Ders tamamlandı!</h2><p>3 soruda '+score+' doğru.</p><button onclick="academyLessons()">Derslere dön</button></div>'}
function academyExamMenu(){app.innerHTML='<h1>🎓 Genişletilmiş Sınav Merkezi</h1><p class="muted">Her sınav türünde özgün 5 soru; cevaplar açıklamalıdır. Bu kısa denemeler resmî sınavların tam uzunluğunda değildir.</p>'+['YDT','YDS','YÖKDİL','HAZIRLIK'].map(k=>'<div class="card"><h2>'+k+'</h2><button onclick="academyExam(\''+k+'\',0,0)">5 Soruluk Denemeyi Başlat</button></div>').join('')}
function academyExam(k,i,score){let arr=ACADEMY_EXAMS.filter(x=>x[0]===k);if(i===arr.length){saved.scores.push({exam:k,score,total:arr.length,date:new Date().toISOString()});persist();app.innerHTML='<div class="card"><h2>'+k+' sonuç</h2><p>'+score+'/'+arr.length+' doğru</p><button onclick="academyExamMenu()">Sınavlara dön</button></div>';return}let q=arr[i];app.innerHTML='<div class="card"><h2>'+k+' • Soru '+(i+1)+'/'+arr.length+'</h2><p>'+q[1]+'</p>'+q[2].map((c,n)=>'<button class="choice" onclick="academyExamCheck(\''+k+'\','+i+','+score+','+n+')">'+String.fromCharCode(65+n)+') '+c+'</button>').join('')+'</div>'}
function academyExamCheck(k,i,score,n){let q=ACADEMY_EXAMS.filter(x=>x[0]===k)[i],ok=n===q[3];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);app.querySelector('.card').insertAdjacentHTML('beforeend','<p class="'+(ok?'good':'bad')+'">'+(ok?'Doğru!':'Yanlış. Doğru cevap: '+String.fromCharCode(65+q[3]))+'</p><p>'+q[4]+'</p><button onclick="academyExam(\''+k+'\','+(i+1)+','+(score+(ok?1:0))+')">Sonraki soru</button>')}
const previousView=view;view=function(v){if(v==='lessons')return academyLessons();if(v==='exams')return academyExamMenu();return previousView(v)}
</script><script src="./enhancements.js"></script><script>
async function updateAcademyApp(){
 const b=document.getElementById('updateAppButton');if(b){b.disabled=true;b.textContent='⏳ Kontrol ediliyor'}
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.filter(r=>r.scope.startsWith(new URL('./',location.href).href)).map(async r=>{await r.update();if(r.waiting)r.waiting.postMessage({type:'SKIP_WAITING'})}));
  }
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('tea-')).map(k=>caches.delete(k)))}
  const u=new URL(location.href);u.searchParams.set('refresh',Date.now().toString());location.replace(u.toString());
 }catch(e){if(b){b.disabled=false;b.textContent='🔄 Güncelle'}alert('Güncelleme kontrolü tamamlanamadı. İnternet bağlantısını kontrol edip yeniden deneyin.')}
}
</script></body></html>
